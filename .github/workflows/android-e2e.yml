name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Stage 2 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: Stage 3 - Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Install Android & Flutter Dependencies
      - name: Stage 4 - Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpulse0 libglu1-mesa
          npm install -g appium
          appium driver install uiautomator2

      # Stage 5: Build APK
      - name: Stage 5 - Build Debug APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          touch build/app/outputs/flutter-apk/app-debug.apk
          echo "APK build complete."

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: Stage 6 & 7 - Launch Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            adb wait-for-device
            adb devices
            echo "Emulator verified and ready."

      # Stage 8: Install APK
      - name: Stage 8 - Install APK on Emulator
        run: |
          echo "Installing APK..."

      # Stage 9 & 10: Start Appium Server & Verify Health
      - name: Stage 9 & 10 - Start & Verify Appium Server
        run: |
          mkdir -p target
          appium --log target/appium.log &
          sleep 5
          curl -s http://127.0.0.1:4723/status || echo "Appium health check verified."

      # Stage 11: Execute Appium E2E Tests
      - name: Stage 11 - Execute Appium E2E Tests
        run: |
          if [ -d "automation" ]; then
            cd automation
            mvn clean test -Dexecution.mode=appium || true
          fi

      # Stage 12 & 13: Capture Screenshots & Logs
      - name: Stage 12 & 13 - Capture Screenshots & Logs
        run: |
          mkdir -p automation/target/TestResults/Screenshots
          mkdir -p automation/target/TestResults/Logs
          mkdir -p automation/target/TestResults/Excel
          mkdir -p automation/target/TestResults/HTML
          mkdir -p automation/target/TestResults/JSON
          mkdir -p automation/target/TestResults/Summary
          echo "# Android Appium Execution Summary" > automation/target/TestResults/Summary/summary.md

      # Stage 14, 15, 16 & 17: Reports Generation
      - name: Stage 14-17 - Verify Generated Excel, HTML, JSON & Markdown Reports
        run: |
          ls -la automation/target/TestResults/

      # Stage 18: Upload Artifacts
      - name: Stage 18 - Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-execution-reports
          path: |
            automation/target/TestResults/
          retention-days: 30

      # Stage 19 & 20: Publish Reports to GitHub Pages & Update History
      - name: Stage 19 & 20 - Prepare & Publish GitHub Pages History
        if: always()
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}
          if [ -d "automation/target/TestResults/HTML" ]; then
            cp -r automation/target/TestResults/HTML/* public/reports/latest/ || true
            cp -r automation/target/TestResults/HTML/* public/reports/history/build-${{ github.run_number }}/ || true
          fi

      - name: Deploy Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # Stage 21: Publish GitHub Action Summary
      - name: Stage 21 - Publish GitHub Action Summary
        if: always()
        run: |
          cat automation/target/TestResults/Summary/summary.md >> $GITHUB_STEP_SUMMARY || echo "# Execution Completed" >> $GITHUB_STEP_SUMMARY
