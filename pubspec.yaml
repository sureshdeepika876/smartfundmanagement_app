name: smartfundmanagement
description: "ExpenseTrackerApp"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3

  # On-device OCR for receipt scanning (no backend / API key needed)
  google_mlkit_text_recognition: ^0.16.0

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.3
  intl: ^0.20.3
  google_fonts: ^8.2.0
  shimmer: ^3.0.0

  # Local / device
  image_picker: ^1.1.2
  camera: ^0.12.0+2
  path_provider: ^2.1.3
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.2.3

  # Bank SMS auto-read (Android only — no SMS inbox API exists on iOS)
  telephony: ^0.2.0

  # PDF & Excel export
  pdf: ^3.11.0
  printing: ^5.12.0
  excel: ^4.0.2
  share_plus: ^13.3.0

  # Speech to text for voice expense entry
  speech_to_text: ^7.4.0

  # Local notifications
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/applogo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/